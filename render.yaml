services:
  - type: worker
    name: 1tamilvtg-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot
    autoDeploy: true
    envVars:
      - key: TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: ALLOWED_USERS
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: CHANNEL_USERNAME
        sync: false
      - key: TAMILMV_URL
        value: https://www.1tamilmv.ing
      - key: SCRAPE_INTERVAL
        value: "300"
      - key: LOG_LEVEL
        value: INFO
